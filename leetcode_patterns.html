<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; padding: 24px; }
  h1 { font-size: 18px; color: #a78bfa; margin-bottom: 20px; letter-spacing: 0.5px; }
  .pattern { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
  .pattern-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; cursor: pointer; user-select: none; }
  .pattern-header:hover { background: #1f2235; }
  .pattern-title { font-size: 14px; font-weight: 600; color: #c4b5fd; }
  .pattern-num { font-size: 12px; color: #6366f1; margin-right: 8px; }
  .progress { font-size: 11px; color: #6b7280; background: #0f1117; padding: 2px 8px; border-radius: 99px; }
  .chevron { color: #6b7280; font-size: 12px; transition: transform 0.2s; }
  .pattern.open .chevron { transform: rotate(180deg); }
  .pattern-body { display: none; padding: 0 16px 14px; }
  .pattern.open .pattern-body { display: block; }
  .section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; margin: 12px 0 6px; }
  .section-label.examples { color: #34d399; }
  .section-label.homework { color: #f59e0b; }
  .divider { height: 1px; background: #2a2d3a; margin: 10px 0; }
  .item { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; }
  .item input[type=checkbox] { margin-top: 2px; accent-color: #6366f1; width: 14px; height: 14px; flex-shrink: 0; cursor: pointer; }
  .item label { font-size: 13px; color: #cbd5e1; cursor: pointer; line-height: 1.4; }
  .item input:checked + label { color: #4b5563; text-decoration: line-through; }
  .stats-bar { height: 3px; background: #2a2d3a; border-radius: 99px; margin-top: 8px; }
  .stats-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #a78bfa); border-radius: 99px; transition: width 0.3s; }
  .global-progress { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
  .global-progress span { font-size: 12px; color: #6b7280; }
  .global-progress strong { font-size: 14px; color: #a78bfa; }
</style>

function makeId(patternNum, type, i) {
  return `p${patternNum}-${type}-${i}`;
}

function buildPatterns() {
  const container = document.getElementById('patterns');
  data.forEach(p => {
    const div = document.createElement('div');
    div.className = 'pattern';
    div.id = `pattern-${p.num}`;

    const total = p.examples.length + p.homework.length;
    div.innerHTML = `
      <div class="pattern-header" onclick="togglePattern('${p.num}')">
        <div style="display:flex;align-items:center">
          <span class="pattern-num">${p.num}.</span>
          <span class="pattern-title">${p.title}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="progress" id="prog-${p.num}">0 / ${total}</span>
          <span class="chevron">▼</span>
        </div>
      </div>
      <div class="pattern-body">
        <div class="stats-bar"><div class="stats-fill" id="fill-${p.num}" style="width:0%"></div></div>
        <div class="section-label examples">✦ Examples</div>
        ${p.examples.map((q, i) => `
          <div class="item">
            <input type="checkbox" id="${makeId(p.num,'ex',i)}" onchange="updateProgress('${p.num}')">
            <label for="${makeId(p.num,'ex',i)}">${q}</label>
          </div>`).join('')}
        ${p.homework.length > 0 ? `
        <div class="divider"></div>
        <div class="section-label homework">★ Homework</div>
        ${p.homework.map((q, i) => `
          <div class="item">
            <input type="checkbox" id="${makeId(p.num,'hw',i)}" onchange="updateProgress('${p.num}')">
            <label for="${makeId(p.num,'hw',i)}">${q}</label>
          </div>`).join('')}` : ''}
      </div>`;
    container.appendChild(div);
  });
  updateGlobal();
}

function togglePattern(num) {
  document.getElementById(`pattern-${num}`).classList.toggle('open');
}

function updateProgress(num) {
  const p = data.find(x => x.num === num);
  const total = p.examples.length + p.homework.length;
  let done = 0;
  p.examples.forEach((_, i) => { if (document.getElementById(makeId(num,'ex',i))?.checked) done++; });
  p.homework.forEach((_, i) => { if (document.getElementById(makeId(num,'hw',i))?.checked) done++; });
  document.getElementById(`prog-${num}`).textContent = `${done} / ${total}`;
  document.getElementById(`fill-${num}`).style.width = total ? `${(done/total)*100}%` : '0%';
  updateGlobal();
}

function updateGlobal() {
  let total = 0, done = 0;
  data.forEach(p => {
    p.examples.forEach((_, i) => { total++; if (document.getElementById(makeId(p.num,'ex',i))?.checked) done++; });
    p.homework.forEach((_, i) => { total++; if (document.getElementById(makeId(p.num,'hw',i))?.checked) done++; });
  });
  document.getElementById('global-text').textContent = `${done} / ${total}`;
  document.getElementById('global-fill').style.width = `${(done/total)*100}%`;
}

buildPatterns();
</script>
